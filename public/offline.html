<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ออฟไลน์ | ระบบควบคุมสินค้าคงคลัง กยท.</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #f4f7f5;
    color: #16211b;
    font-family: "Noto Sans Thai", "Sarabun", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    line-height: 1.65;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: #fff;
    border: 1px solid #dde5e0;
    border-radius: 16px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 12px 40px -12px rgba(0, 40, 20, 0.28);
  }
  h1 { font-size: 19px; margin: 16px 0 10px; }
  p { margin: 0 0 10px; color: #5c6b62; font-size: 14.5px; }
  .muted { font-size: 13px; color: #8a978f; }
  button {
    margin-top: 18px;
    width: 100%;
    padding: 11px 16px;
    border: 0;
    border-radius: 10px;
    background: #00693c;
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #004f2d; }
</style>
</head>
<body>
  <div class="card">
    <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="30" fill="#00693C"/>
      <path d="M32 13c-9 6-14 13-14 21a14 14 0 0 0 28 0c0-8-5-15-14-21z" fill="#A8CF45"/>
      <path d="M32 18v30M32 30l7-6M32 38l-7-6" stroke="#00512F" stroke-width="2.6" stroke-linecap="round"/>
    </svg>

    <h1>ไม่ได้เชื่อมต่ออินเทอร์เน็ต</h1>
    <p>
      ระบบควบคุมสินค้าคงคลังต้องออนไลน์เพื่ออ่านและบันทึกข้อมูล
      เพราะข้อมูลทั้งหมดเก็บอยู่บนฐานข้อมูลกลางที่แชร์กับผู้ใช้ทุกคน
    </p>
    <p class="muted">ตรวจสอบการเชื่อมต่อแล้วกดปุ่มด้านล่างเพื่อลองใหม่</p>
    <button type="button" onclick="location.reload()">ลองใหม่</button>
  </div>

  <script>
    // กลับเข้าหน้าหลักเองทันทีที่เน็ตกลับมา
    window.addEventListener("online", function () { location.replace("/"); });
  </script>
</body>
</html>
