<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultra ERP | ระบบควบคุมสินค้าคงคลัง</title>
<meta name="description" content="ระบบควบคุมสินค้าคงคลัง (Inventory Control) — รับ / เบิก / โอน / ปรับปรุงสินค้า พร้อมรายงานและกราฟสรุป">
<style>
/* ============================================================
   Design tokens — โทนสีเขียวเริ่มต้นของโปรแกรม ()
   ============================================================ */
:root{
  --brand:#00693C;          /* เขียวหลัก */
  --brand-d:#004F2D;        /* เขียวเข้ม */
  --brand-l:#0F8A4D;        /* เขียวสว่าง */
  --brand-50:#EAF5EF;       /* เขียวจาง (พื้นหลัง) */
  --brand-100:#D2EADE;
  --accent:#A8CF45;         /* เขียวอมเหลือง (ใบยาง) */

  --bg:#F4F7F5;
  --surface:#FFFFFF;
  --surface-2:#FAFBFA;
  --fg:#16211B;
  --fg-muted:#5C6B62;
  --fg-faint:#8A978F;
  --border:#DDE5E0;
  --border-strong:#C3CFC8;

  --ok:#0F8A4D; --ok-bg:#E6F4EC;
  --warn:#B26A00; --warn-bg:#FDF1E0;
  --err:#B3261E; --err-bg:#FDECEA;
  --info:#0B5FA5; --info-bg:#E7F0FA;

  --radius:12px;
  --shadow:0 1px 2px rgba(0,40,20,.05), 0 6px 20px -8px rgba(0,40,20,.14);
  --shadow-lg:0 12px 40px -12px rgba(0,40,20,.28);
  --sidebar-w:250px;
  --sans:"Noto Sans Thai","Sarabun","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,Consolas,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:700;letter-spacing:-.01em}
p{margin:0}
a{color:var(--brand);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
table{border-collapse:collapse;width:100%}
[hidden]{display:none !important}

/* ---------- Form controls ---------- */
.inp,.sel,.txa{
  width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:9px;
  background:var(--surface);transition:border-color .15s,box-shadow .15s;
}
.inp:focus,.sel:focus,.txa:focus{
  outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-100);
}
.inp:disabled,.sel:disabled{background:var(--surface-2);color:var(--fg-muted)}
.txa{resize:vertical;min-height:70px}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--fg-muted);margin-bottom:5px}
.field{margin-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 16px;border-radius:9px;border:1px solid transparent;
  font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:filter .15s,background .15s,border-color .15s,transform .1s;
}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-p{background:var(--brand);color:#fff}
.btn-p:hover:not(:disabled){background:var(--brand-d)}
.btn-o{background:var(--surface);color:var(--brand);border-color:var(--brand)}
.btn-o:hover:not(:disabled){background:var(--brand-50)}
.btn-g{background:var(--surface);color:var(--fg);border-color:var(--border-strong)}
.btn-g:hover:not(:disabled){background:var(--surface-2)}
.btn-d{background:var(--surface);color:var(--err);border-color:#EBC4C1}
.btn-d:hover:not(:disabled){background:var(--err-bg)}
.btn-sm{padding:6px 11px;font-size:13.5px;border-radius:8px}
.btn-icon{padding:6px;width:32px;height:32px}

/* ---------- Login ---------- */
#login{
  min-height:100vh;display:grid;place-items:center;padding:20px;
  background:
    radial-gradient(ellipse 70% 60% at 15% 10%, rgba(168,207,69,.28), transparent 60%),
    radial-gradient(ellipse 70% 70% at 90% 90%, rgba(15,138,77,.30), transparent 60%),
    linear-gradient(160deg,#00512F,#00693C 55%,#0F8A4D);
}
.login-card{
  width:100%;max-width:420px;background:var(--surface);border-radius:18px;
  padding:36px 32px;box-shadow:var(--shadow-lg);
}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:26px;text-align:center}
.login-logo h1{font-size:20px}
.login-logo small{color:var(--fg-muted);font-size:13.5px;font-weight:500;line-height:1.5}
.login-card .field{margin-bottom:16px}
.hint{
  margin-top:18px;padding:11px 13px;background:var(--brand-50);border:1px dashed var(--brand-100);
  border-radius:9px;font-size:13px;color:var(--brand-d);
}
.hint code{font-family:var(--mono);font-weight:700}

/* ---------- App shell ---------- */
#app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
aside{
  background:linear-gradient(180deg,var(--brand-d),var(--brand) 45%,#00713F);
  color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.14)}
.brand-txt strong{display:block;font-size:14.5px;line-height:1.35}
.brand-txt span{font-size:11.5px;opacity:.8}
.side-nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-group{
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;opacity:.6;
  padding:14px 12px 6px;font-weight:700;
}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9.5px 12px;border-radius:9px;border:0;background:transparent;color:#fff;
  font-size:14.5px;font-weight:500;cursor:pointer;transition:background .15s;
}
.nav-item:hover{background:rgba(255,255,255,.12)}
.nav-item.active{background:rgba(255,255,255,.22);font-weight:700}
.nav-item svg{flex:none;opacity:.92}
.side-foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.14);font-size:12.5px;opacity:.82}

main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:12px 22px;
  display:flex;align-items:center;gap:14px;
}
.topbar h2{font-size:18px}
.topbar .sub{font-size:12.5px;color:var(--fg-muted);font-weight:500}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.user-chip{
  display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;
  background:var(--brand-50);border-radius:999px;font-size:13.5px;font-weight:600;color:var(--brand-d);
}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700}
#burger{display:none}
.content{padding:22px;flex:1;max-width:1500px;width:100%}

/* ---------- Cards / layout ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card-h h3{font-size:15.5px}
.card-h .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card-b{padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.span2{grid-column:span 2}
.span4{grid-column:span 4}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- KPI ---------- */
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.kpi .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--brand-50);color:var(--brand)}
.kpi .lb{font-size:13px;color:var(--fg-muted);font-weight:600}
.kpi b{font-size:26px;font-weight:750;letter-spacing:-.02em;display:block;line-height:1.15}
.kpi .sub{font-size:12.5px;color:var(--fg-faint);margin-top:3px}
.kpi.warn .ic{background:var(--warn-bg);color:var(--warn)}
.kpi.err .ic{background:var(--err-bg);color:var(--err)}
.kpi.info .ic{background:var(--info-bg);color:var(--info)}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
table.tbl{font-size:14px;background:var(--surface)}
table.tbl th{
  background:var(--brand-50);color:var(--brand-d);text-align:left;font-weight:700;font-size:13px;
  padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--border);position:sticky;top:0;
}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl tfoot td{background:var(--brand-50);font-weight:700;border-top:2px solid var(--brand-100)}
.empty{text-align:center;padding:34px 16px;color:var(--fg-faint);font-size:14px}

/* ---------- Badges ---------- */
.bdg{display:inline-flex;align-items:center;gap:5px;padding:2.5px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.bdg-ok{background:var(--ok-bg);color:var(--ok)}
.bdg-warn{background:var(--warn-bg);color:var(--warn)}
.bdg-err{background:var(--err-bg);color:var(--err)}
.bdg-info{background:var(--info-bg);color:var(--info)}
.bdg-gray{background:#EEF1EF;color:var(--fg-muted)}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{
  padding:9px 15px;border:0;background:transparent;cursor:pointer;font-size:14.5px;font-weight:600;
  color:var(--fg-muted);border-bottom:2.5px solid transparent;white-space:nowrap;
}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}

/* ---------- Product cards ---------- */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:15px}
.prod{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.prod .ph{height:135px;background:var(--brand-50);display:grid;place-items:center;overflow:hidden;position:relative}
.prod .ph img{width:100%;height:100%;object-fit:cover}
.prod .ph .noimg{color:var(--brand);opacity:.35}
.prod .bd{padding:13px;display:flex;flex-direction:column;gap:5px;flex:1}
.prod .code{font-family:var(--mono);font-size:11.5px;color:var(--fg-faint)}
.prod .nm{font-weight:700;font-size:14.5px;line-height:1.35}
.prod .meta{font-size:12.5px;color:var(--fg-muted)}
.prod .ft{padding:10px 13px;border-top:1px solid var(--border);display:flex;gap:7px;background:var(--surface-2)}
.prod .ft .btn{flex:1}

/* ---------- Image upload ---------- */
.drop{
  border:2px dashed var(--border-strong);border-radius:11px;padding:16px;text-align:center;
  background:var(--surface-2);cursor:pointer;transition:.15s;
}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-50)}
.drop img{max-height:140px;border-radius:8px;margin-bottom:8px}
.drop .t{font-size:13.5px;color:var(--fg-muted)}

/* ---------- Barcode ---------- */
.bc-box{background:#fff;border:1px solid var(--border);border-radius:9px;padding:12px;text-align:center}
.bc-box svg{max-width:100%;height:auto}
.bc-txt{font-family:var(--mono);font-size:12.5px;letter-spacing:.16em;margin-top:5px}

/* ---------- Map ---------- */
.map-wrap{position:relative;border-radius:11px;overflow:hidden;border:1px solid var(--border);background:var(--brand-50)}
.map-wrap iframe{width:100%;height:420px;border:0;display:block}
.prov-list{max-height:470px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.prov{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--border);
  border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;width:100%;transition:.15s;
}
.prov:hover{border-color:var(--brand);background:var(--brand-50)}
.prov.active{border-color:var(--brand);background:var(--brand-50);box-shadow:0 0 0 2px var(--brand-100)}
.prov .pin{width:32px;height:32px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.prov .info{flex:1;min-width:0}
.prov .info b{display:block;font-size:14px}
.prov .info span{font-size:12px;color:var(--fg-muted)}
.prov .qty{text-align:right;font-variant-numeric:tabular-nums}
.prov .qty b{display:block;font-size:15px;color:var(--brand-d)}
.prov .qty span{font-size:11.5px;color:var(--fg-faint)}

/* ---------- Charts ---------- */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;min-width:520px;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--fg-muted);margin-top:10px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,30,20,.5);display:grid;place-items:center;padding:20px;z-index:100;overflow-y:auto}
.modal{background:var(--surface);border-radius:15px;box-shadow:var(--shadow-lg);width:100%;max-width:720px;max-height:92vh;display:flex;flex-direction:column}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.modal-h h3{font-size:16.5px;flex:1}
.modal-b{padding:20px;overflow-y:auto}
.modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;background:var(--surface-2);border-radius:0 0 15px 15px}

/* ---------- Toast ---------- */
#toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:9px}
.toast{
  background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--brand);
  border-radius:10px;padding:11px 15px;box-shadow:var(--shadow-lg);font-size:14px;
  min-width:250px;max-width:380px;animation:slide .25s ease;
}
.toast.err{border-left-color:var(--err)}
.toast.warn{border-left-color:var(--warn)}
@keyframes slide{from{opacity:0;transform:translateX(24px)}}

/* ---------- Print ---------- */
#printRoot{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:11.5pt}
  .no-print{display:none !important}
  #printRoot{display:block !important}
  .pr-head{display:flex;align-items:flex-start;gap:14px;border-bottom:2.5px solid #00693C;padding-bottom:10px;margin-bottom:14px}
  .pr-head .org b{display:block;font-size:14pt;color:#00693C}
  .pr-head .org span{font-size:9.5pt;color:#444}
  .pr-head .rt{margin-left:auto;text-align:right;font-size:9.5pt;color:#444}
  .pr-title{text-align:center;font-size:13.5pt;font-weight:700;margin:6px 0 3px}
  .pr-sub{text-align:center;font-size:10pt;color:#444;margin-bottom:12px}
  #printRoot table{width:100%;border-collapse:collapse;font-size:10pt}
  #printRoot th{background:#EAF5EF !important;border:1px solid #9BBFAB;padding:5px 7px;text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printRoot td{border:1px solid #C3CFC8;padding:4.5px 7px}
  #printRoot tfoot td{background:#EAF5EF !important;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pr-sign{display:flex;justify-content:space-around;margin-top:34px;font-size:10pt;text-align:center}
  .pr-sign div{width:31%}
  .pr-sign .line{border-bottom:1px dotted #333;height:34px;margin-bottom:5px}
  .pr-note{margin-top:10px;font-size:9pt;color:#555}
  .pg-break{page-break-after:always}
  .lbl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm}
  .lbl-card{border:1px dashed #888;padding:5px;text-align:center;break-inside:avoid}
}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .form-grid{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  aside{
    position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);z-index:60;
    transform:translateX(-100%);transition:transform .22s ease;height:100vh;
  }
  aside.open{transform:translateX(0);box-shadow:var(--shadow-lg)}
  #burger{display:grid}
  #scrim{position:fixed;inset:0;background:rgba(10,30,20,.45);z-index:55}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .content{padding:15px}
  .topbar{padding:11px 15px}
  .span2,.span4{grid-column:span 2}
}
@media (max-width:560px){
  .form-grid{grid-template-columns:1fr}
  .span2,.span4{grid-column:span 1}
  .topbar h2{font-size:16px}
  .user-chip span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<!-- ══════════════════ LOGIN ══════════════════ -->
<div id="login" class="no-print">
  <form class="login-card" id="loginForm" novalidate>
    <div class="login-logo">
      <svg width="62" height="62" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="#00693C"/>
        <path d="M32 13c-9 6-14 13-14 21a14 14 0 0 0 28 0c0-8-5-15-14-21z" fill="#A8CF45"/>
        <path d="M32 18v30M32 30l7-6M32 38l-7-6" stroke="#00693C" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>ระบบควบคุมสินค้าคงคลัง</h1>
        <small>Ultra ERP<br>ระบบควบคุมสินค้าคงคลัง</small>
      </div>
    </div>

    <div class="field">
      <label class="lbl" for="u">ชื่อผู้ใช้งาน</label>
      <input class="inp" id="u" autocomplete="username" placeholder="admin" required>
    </div>
    <div class="field">
      <label class="lbl" for="p">รหัสผ่าน</label>
      <input class="inp" id="p" type="password" autocomplete="current-password" placeholder="••••••••" required>
    </div>
    <div id="loginErr" class="bdg bdg-err" style="margin-bottom:14px;display:none"></div>
    <button class="btn btn-p" type="submit" style="width:100%;padding:11px">เข้าสู่ระบบ</button>

    <div class="hint">
      บัญชีสำหรับทดสอบ (ไม่ใช้ฐานข้อมูล) — ชื่อผู้ใช้ <code>admin</code> · รหัสผ่าน <code>admin888</code>
    </div>
  </form>
</div>

<!-- ══════════════════ APP ══════════════════ -->
<div id="app" class="no-print" hidden>
  <aside id="sidebar">
    <div class="brand">
      <svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="#fff" opacity=".16"/>
        <path d="M32 13c-9 6-14 13-14 21a14 14 0 0 0 28 0c0-8-5-15-14-21z" fill="#A8CF45"/>
        <path d="M32 18v30M32 30l7-6M32 38l-7-6" stroke="#00512F" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <div class="brand-txt">
        <strong>Ultra ERP</strong>
        <span>Inventory Control</span>
      </div>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot">
      <div>คลังที่ใช้งาน: <b id="footWh">—</b></div>
      <div style="margin-top:4px;opacity:.75">เวอร์ชัน 1.0 · ข้อมูลเก็บในเครื่อง</div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <button class="btn btn-g btn-icon" id="burger" aria-label="เปิดเมนู">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div>
        <h2 id="pgTitle">แดชบอร์ด</h2>
        <div class="sub" id="pgSub">ภาพรวมสินค้าคงคลัง</div>

/* PRNG แบบกำหนด seed — ให้ข้อมูลตัวอย่างเหมือนกันทุกครั้ง */
function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** สร้างบาร์โค้ด Code128-B เป็น SVG (ไม่ต้องใช้ไลบรารีภายนอก) */
function barcodeSVG(text, opt) {
  opt = opt || {};
  const mw = opt.module || 2, h = opt.height || 54, showTxt = opt.text !== false;
  const s = String(text || "").replace(/[^\x20-\x7E]/g, "");
  if (!s) return '<div style="color:#8A978F;font-size:13px;padding:12px">— ยังไม่กำหนดบาร์โค๊ด —</div>';

  const vals = [104];                                   // START B
  for (let i = 0; i < s.length; i++) vals.push(s.charCodeAt(i) - 32);
  let sum = 104;
  for (let i = 1; i < vals.length; i++) sum += vals[i] * i;
  vals.push(sum % 103);                                 // check digit
  vals.push(106);                                       // STOP

  let x = 0, rects = "";
  vals.forEach(v => {
    const pat = C128[v];
    for (let i = 0; i < pat.length; i++) {
      const w = parseInt(pat[i], 10) * mw;
      if (i % 2 === 0) rects += '<rect x="' + x + '" y="0" width="' + w + '" height="' + h + '"/>';
      x += w;
    }
  });
  const total = x, th = showTxt ? 16 : 0;
  return '<svg viewBox="0 0 ' + total + ' ' + (h + th) + '" width="' + total + '" height="' + (h + th) +
    '" role="img" aria-label="บาร์โค๊ด ' + esc(s) + '"><rect width="' + total + '" height="' + (h + th) +
    '" fill="#fff"/><g fill="#111">' + rects + '</g>' +
    (showTxt ? '<text x="' + (total / 2) + '" y="' + (h + 13) +
      '" text-anchor="middle" font-family="monospace" font-size="13" letter-spacing="2" fill="#111">' +
      esc(s) + '</text>' : '') + '</svg>';
}

let DB = null;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { DB = JSON.parse(raw); if (DB && DB.products && DB.warehouses && DB.txns) return; }
  } catch (e) { /* ข้อมูลเสียหาย → สร้างใหม่ */ }

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch (e) { toast("บันทึกข้อมูลไม่สำเร็จ — พื้นที่จัดเก็บของเบราว์เซอร์เต็ม", "err"); }
}

function seed() {
  const db = {
    warehouses: SEED_WH.map(w => Object.assign({}, w)),
    products: SEED_PROD.map((p, i) => Object.assign({ id: "PR" + (i + 1), img: "", note: "" }, p)),
    txns: [],
    counters: {}
  };

  const r = rng(20260827);
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth() - 7, 1);
  const days = Math.floor((now - start) / 86400000);
  const users = ["admin", "somchai.k", "nipa.s", "wichai.p"];

  // ยอดยกมาต้นงวด
  db.products.forEach(p => {
    db.warehouses.forEach(w => {
      const base = Math.round(p.min * (1.2 + r() * 2.2));
      db.txns.push({
        id: uid(), type: "RECEIVE", docNo: "RC-OPEN-" + p.code + "-" + w.code,
        date: start.toISOString().slice(0, 10), productId: p.id, qty: base,
        whId: w.id, whTo: "", note: "ยอดยกมาต้นงวด", user: "admin",
        ts: start.getTime(), ref: "ยกมา"
      });
    });
  });

  // รายการเคลื่อนไหวย้อนหลัง
  const kinds = ["RECEIVE", "ISSUE", "ISSUE", "ISSUE", "TRANSFER", "ADJUST"];
  for (let i = 0; i < 320; i++) {
    const d = new Date(start.getTime() + Math.floor(r() * days) * 86400000 + 7 * 86400000);
    if (d > now) continue;
    const iso = d.toISOString().slice(0, 10);
    const p = db.products[Math.floor(r() * db.products.length)];
    const w = db.warehouses[Math.floor(r() * db.warehouses.length)];
    const type = kinds[Math.floor(r() * kinds.length)];
    let qty = Math.max(1, Math.round(p.min * (0.05 + r() * 0.35)));
    let whTo = "";
    if (type === "TRANSFER") {
      let t = db.warehouses[Math.floor(r() * db.warehouses.length)];
      if (t.id === w.id) t = db.warehouses[(db.warehouses.indexOf(w) + 3) % db.warehouses.length];
      whTo = t.id;
    }
    if (type === "ADJUST") qty = (r() < 0.5 ? -1 : 1) * Math.max(1, Math.round(p.min * r() * 0.06));
    db.txns.push({
      id: uid(), type: type, docNo: "", date: iso, productId: p.id, qty: qty,
      whId: w.id, whTo: whTo, user: users[Math.floor(r() * users.length)],
      note: type === "ADJUST" ? "ปรับปรุงจากการตรวจนับ" : "", ts: d.getTime(), ref: ""
    });
  }

  db.txns.sort((a, b) => a.ts - b.ts);
  // ออกเลขที่เอกสารตามลำดับเวลา
  const seq = {};
  db.txns.forEach(t => {
    if (t.docNo) return;
    const ym = t.date.slice(0, 7).replace("-", "");
    const k = TYPES[t.type].code + ym;
    seq[k] = (seq[k] || 0) + 1;
    t.docNo = TYPES[t.type].code + "-" + ym + "-" + String(seq[k]).padStart(4, "0");
  });
  db.counters = seq;
  return db;
}

/* ---------------------------------------------------------- lookups */
const prodById = id => DB.products.find(p => p.id === id);
const whById   = id => DB.warehouses.find(w => w.id === id);
const prodName = id => { const p = prodById(id); return p ? p.name : "(ถูกลบ)"; };
const whName   = id => { const w = whById(id); return w ? w.name : "—"; };

function nextDocNo(type, dateISO) {
  const ym = (dateISO || todayISO()).slice(0, 7).replace("-", "");
  const k = TYPES[type].code + ym;
  const n = (DB.counters[k] || 0) + 1;
  return TYPES[type].code + "-" + ym + "-" + String(n).padStart(4, "0");
}
function commitDocNo(type, dateISO) {
  const ym = (dateISO || todayISO()).slice(0, 7).replace("-", "");
  const k = TYPES[type].code + ym;
  DB.counters[k] = (DB.counters[k] || 0) + 1;
}

/** คำนวณยอดคงเหลือทั้งหมด → { "productId|whId": qty } */
function stockMap(untilTs) {
  const m = Object.create(null);
  const add = (pid, wid, q) => {
    const k = pid + "|" + wid;
    m[k] = (m[k] || 0) + q;
  };
  DB.txns.forEach(t => {
    if (untilTs != null && t.ts > untilTs) return;
    if (t.type === "RECEIVE") add(t.productId, t.whId, t.qty);
    else if (t.type === "ISSUE") add(t.productId, t.whId, -t.qty);
    else if (t.type === "ADJUST") add(t.productId, t.whId, t.qty);
    else if (t.type === "TRANSFER") { add(t.productId, t.whId, -t.qty); add(t.productId, t.whTo, t.qty); }
  });
  return m;
}
const stockOf = (pid, wid, m) => (m || stockMap())[pid + "|" + wid] || 0;
function stockTotal(pid, m) {
  m = m || stockMap();
  return DB.warehouses.reduce((s, w) => s + (m[pid + "|" + w.id] || 0), 0);
}
function whTotal(wid, m) {
  m = m || stockMap();
  return DB.products.reduce((s, p) => s + (m[p.id + "|" + wid] || 0), 0);
}

/* ============================================================ Charts (SVG) */
function chartBars(series, labels, opts) {
  opts = opts || {};
  const W = 760, H = opts.height || 260, PL = 62, PR = 14, PT = 14, PB = 34;
  const iw = W - PL - PR, ih = H - PT - PB;
  const max = Math.max(1, ...series.flatMap(s => s.data));
  const step = iw / Math.max(1, labels.length);
  const gw = step * 0.68, bw = gw / series.length;
  let g = "";

  for (let i = 0; i <= 4; i++) {
    const y = PT + ih - (ih * i / 4);
    g += '<line x1="' + PL + '" y1="' + y + '" x2="' + (W - PR) + '" y2="' + y +
         '" stroke="#DDE5E0" stroke-width="1"/>' +
         '<text x="' + (PL - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="#8A978F">' +
         num(Math.round(max * i / 4), 0) + '</text>';
  }
  labels.forEach((lb, i) => {
    const cx = PL + step * i + step / 2;
    series.forEach((s, si) => {
      const h = (s.data[i] || 0) / max * ih;
      const x = cx - gw / 2 + bw * si;
      g += '<rect x="' + x.toFixed(1) + '" y="' + (PT + ih - h).toFixed(1) + '" width="' + (bw - 2).toFixed(1) +
           '" height="' + Math.max(0, h).toFixed(1) + '" fill="' + s.color + '" rx="2.5"><title>' +
           esc(lb) + ' · ' + esc(s.name) + ': ' + num(s.data[i] || 0, 0) + '</title></rect>';
    });
    g += '<text x="' + cx + '" y="' + (H - 12) + '" text-anchor="middle" font-size="11" fill="#5C6B62">' + esc(lb) + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' + g + '</svg>';
}

function chartLine(data, labels, opts) {
  opts = opts || {};
  const W = 760, H = opts.height || 250, PL = 66, PR = 14, PT = 14, PB = 34;
  const iw = W - PL - PR, ih = H - PT - PB;
  const max = Math.max(1, ...data), min = Math.min(0, ...data);
  const span = Math.max(1, max - min);
  const px = i => PL + (labels.length < 2 ? iw / 2 : iw * i / (labels.length - 1));
  const py = v => PT + ih - ((v - min) / span) * ih;
  const color = opts.color || "#00693C";
  let g = "", pts = [];

  for (let i = 0; i <= 4; i++) {
    const y = PT + ih - (ih * i / 4);
    g += '<line x1="' + PL + '" y1="' + y + '" x2="' + (W - PR) + '" y2="' + y + '" stroke="#DDE5E0"/>' +
         '<text x="' + (PL - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="#8A978F">' +
         num(Math.round(min + span * i / 4), 0) + '</text>';
  }
  data.forEach((v, i) => pts.push(px(i).toFixed(1) + "," + py(v).toFixed(1)));
  g += '<polygon points="' + PL + ',' + (PT + ih) + ' ' + pts.join(" ") + ' ' + px(data.length - 1).toFixed(1) +
       ',' + (PT + ih) + '" fill="' + color + '" opacity=".13"/>';
  g += '<polyline points="' + pts.join(" ") + '" fill="none" stroke="' + color +
       '" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
  data.forEach((v, i) => {
    g += '<circle cx="' + px(i).toFixed(1) + '" cy="' + py(v).toFixed(1) + '" r="4" fill="#fff" stroke="' +
         color + '" stroke-width="2.4"><title>' + esc(labels[i]) + ': ' + num(v, 0) + '</title></circle>';
  });
  labels.forEach((lb, i) => {
    g += '<text x="' + px(i).toFixed(1) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="11" fill="#5C6B62">' +
         esc(lb) + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' + g + '</svg>';
}

function chartHBar(items, opts) {
  opts = opts || {};
  const W = 760, rowH = 30, H = Math.max(90, items.length * rowH + 20), PL = 165, PR = 70;
  const iw = W - PL - PR;
  const max = Math.max(1, ...items.map(i => i.value));
  let g = "";
  items.forEach((it, i) => {
    const y = 10 + i * rowH, w = it.value / max * iw;
    g += '<text x="' + (PL - 10) + '" y="' + (y + 15) + '" text-anchor="end" font-size="12" fill="#16211B">' +
         esc(it.label.length > 22 ? it.label.slice(0, 21) + "…" : it.label) + '</text>' +
         '<rect x="' + PL + '" y="' + (y + 4) + '" width="' + iw + '" height="16" fill="#EAF5EF" rx="4"/>' +
         '<rect x="' + PL + '" y="' + (y + 4) + '" width="' + Math.max(2, w).toFixed(1) + '" height="16" fill="' +
         (it.color || "#00693C") + '" rx="4"><title>' + esc(it.label) + ': ' + num(it.value, 0) + '</title></rect>' +
         '<text x="' + (PL + iw + 8) + '" y="' + (y + 16) + '" font-size="11.5" fill="#5C6B62">' + num(it.value, 0) + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' + g + '</svg>';
}

    '<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true">' +
    '<div class="modal-h"><h3>' + esc(title) + '</h3>' +
    '<button class="btn btn-g btn-icon" id="mClose" aria-label="ปิด">' +
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>' +
    '</button></div>' +
    '<div class="modal-b">' + bodyHTML + '</div>' +
    (footHTML ? '<div class="modal-f">' + footHTML + '</div>' : '') +
    '</div></div>';
  const close = () => { root.innerHTML = ""; document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  $("#mClose").onclick = close;
  $("#mbg").onclick = e => { if (e.target.id === "mbg") close(); };
  document.addEventListener("keydown", onKey);
  if (onMount) onMount(close);
  return close;
}

function tableToCSV(headers, rows, filename) {
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const csv = "﻿" + [headers.map(q).join(",")].concat(rows.map(r => r.map(q).join(","))).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast("ส่งออกไฟล์ " + filename + " แล้ว");
}

  // 6 เดือนล่าสุด

          [ { name:"รับเข้า", color:"#0F8A4D", data:inD }, { name:"จ่ายออก", color:"#B3261E", data:outD } ],

          '<input class="inp num" id="f_bal" readonly value="0"></div>' +
        '<div class="field span2"><label class="lbl" for="f_note">หมายเหตุ</label>' +
          '<input class="inp" id="f_note" placeholder="ระบุรายละเอียดเพิ่มเติม (ถ้ามี)"></div>' +

      '<button class="btn btn-g btn-sm" id="btnCsv">ส่งออก CSV</button>',

  };
  $("#f_prod").onchange = refreshBal;
  $("#f_wh").onchange = refreshBal;
  $("#f_date").onchange = () => { $("#f_doc").value = nextDocNo(type, $("#f_date").value); };

  drawCart(type);

  $("#btnAdd").onclick = () => {
    const pid = $("#f_prod").value, qty = parseFloat($("#f_qty").value);
    const wh = $("#f_wh").value, wh2 = isTf ? $("#f_wh2").value : "";
    if (!(qty > 0)) return toast("กรุณาระบุจำนวนให้มากกว่า 0", "err");
    if (isTf && wh === wh2) return toast("คลังต้นทางและปลายทางต้องไม่ใช่คลังเดียวกัน", "err");
    if (type !== "RECEIVE") {
      const inCart = cart.filter(c => c.productId === pid).reduce((s, c) => s + c.qty, 0);
      const avail = stockOf(pid, wh) - inCart;
      if (qty > avail)
        return toast("ยอดคงเหลือไม่พอ — คงเหลือใช้ได้ " + num(avail, 0) + " หน่วย", "err");

  $("#btnSave").onclick = () => {

    const date = $("#f_date").value || todayISO();

    const ref = isTf ? "" : ($("#f_ref") ? $("#f_ref").value.trim() : "");
    const ts = new Date(date + "T09:00:00").getTime();
    cart.forEach(c => {
      DB.txns.push({
        id: uid(), type: type, docNo: doc, date: date, productId: c.productId,
        qty: c.qty, whId: c.whId, whTo: c.whTo, note: c.note, ref: ref, user: "admin", ts: ts
      });
    });
    commitDocNo(type, date);
    DB.txns.sort((a, b) => a.ts - b.ts);
    save();
    toast("บันทึกเอกสาร " + doc + " (" + cart.length + " รายการ) เรียบร้อย");
    cart = [];
    viewTxn(type);
  };

  $("#btnRep").onclick = () => printTxnReport(type);
  $("#btnCsv").onclick = () => {
    const rows = DB.txns.filter(t => t.type === type).sort((a, b) => b.ts - a.ts).map(t => [
      t.date, t.docNo, prodById(t.productId) ? prodById(t.productId).code : "", prodName(t.productId),
      t.qty, whName(t.whId), t.whTo ? whName(t.whTo) : "", t.user, t.note || "" ]);
    tableToCSV(["วันที่","เลขที่เอกสาร","รหัสสินค้า","ชื่อสินค้า","จำนวน","คลัง","คลังปลายทาง","ผู้ทำรายการ","หมายเหตุ"],
      rows, "รายงาน" + T.name + ".csv");
  };
}

          '</button></td></tr>';
      }).join("") +
      '</tbody><tfoot><tr><td colspan="4">รวมทั้งสิ้น ' + cart.length + ' รายการ</td>' +
      '<td class="num">' + num(cart.reduce((s, c) => s + c.qty, 0), 0) + '</td><td colspan="2"></td></tr></tfoot></table></div>';
    $$("[data-del]", box).forEach(b => b.onclick = () => {
      cart.splice(+b.dataset.del, 1); drawCart(type);
    });
  }
  $("#btnSave").disabled = !cart.length;
}

  const list = DB.txns.filter(t => t.type === type).sort((a, b) => b.ts - a.ts).slice(0, 15);

  const isTf = type === "TRANSFER";
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
    '<th>วันที่</th><th>เลขที่เอกสาร</th><th>สินค้า</th>' +

    '<th class="num">จำนวน</th><th>ผู้ทำรายการ</th></tr></thead><tbody>' +
    list.map(t =>
      '<tr><td>' + thDate(t.date) + '</td>' +

      '<td>' + esc(prodName(t.productId)) + '</td>' +

function printTxnReport(type) {
  const T = TYPES[type], isTf = type === "TRANSFER";
  const list = DB.txns.filter(t => t.type === type).sort((a, b) => a.ts - b.ts);
  if (!list.length) return toast("ไม่มีข้อมูลสำหรับพิมพ์", "warn");
  const html = '<table><thead><tr><th>ลำดับ</th><th>วันที่</th><th>เลขที่เอกสาร</th><th>รหัส</th><th>รายการสินค้า</th>' +
    '<th>หน่วย</th><th>' + (isTf ? "ต้นทาง → ปลายทาง" : "คลัง") + '</th><th style="text-align:right">จำนวน</th></tr></thead><tbody>' +
    list.map((t, i) => {
      const p = prodById(t.productId);
      return '<tr><td>' + (i + 1) + '</td><td>' + thDate(t.date) + '</td><td>' + esc(t.docNo) + '</td>' +
        '<td>' + esc(p ? p.code : "") + '</td><td>' + esc(prodName(t.productId)) + '</td>' +
        '<td>' + esc(p ? p.unit : "") + '</td>' +
        '<td>' + esc(whName(t.whId)) + (isTf ? " → " + esc(whName(t.whTo)) : "") + '</td>' +
        '<td style="text-align:right">' + num(Math.abs(t.qty), 0) + '</td></tr>';
    }).join("") +
    '</tbody><tfoot><tr><td colspan="7">รวมทั้งสิ้น ' + list.length + ' รายการ</td>' +
    '<td style="text-align:right">' + num(list.reduce((s, t) => s + Math.abs(t.qty), 0), 0) + '</td></tr></tfoot></table>';
  printDoc("รายงาน" + T.name, "ข้อมูลทั้งหมด " + list.length + " รายการ", html);

/* ============================================================ VIEW: ปรับปรุงสินค้า */
function viewAdjust() {
  cart = [];
  const docNo = nextDocNo("ADJUST", todayISO());

  $("#content").innerHTML =
    card("บันทึกการปรับปรุงสินค้า (จากผลการตรวจนับ)",
      '<span class="bdg bdg-gray">เลขที่เอกสาร ' + esc(docNo) + '</span>',
      '<div class="form-grid">' +
        '<div class="field"><label class="lbl" for="f_date">วันที่ตรวจนับ</label>' +
          '<input class="inp" type="date" id="f_date" value="' + todayISO() + '"></div>' +
        '<div class="field"><label class="lbl" for="f_doc">เลขที่เอกสาร</label>' +
          '<input class="inp" id="f_doc" value="' + esc(docNo) + '" readonly></div>' +
        '<div class="field span2"><label class="lbl" for="f_wh">คลังสินค้า</label>' +
          '<select class="sel" id="f_wh">' + whOptions() + '</select></div>' +
        '<div class="field span2"><label class="lbl" for="f_prod">สินค้า</label>' +
          '<select class="sel" id="f_prod">' + prodOptions() + '</select></div>' +
        '<div class="field"><label class="lbl">ยอดตามบัญชี</label>' +
          '<input class="inp num" id="f_book" readonly value="0"></div>' +
        '<div class="field"><label class="lbl" for="f_count">ยอดนับได้จริง</label>' +
          '<input class="inp num" type="number" id="f_count" step="any" placeholder="0"></div>' +
        '<div class="field"><label class="lbl">ผลต่าง</label>' +
          '<input class="inp num" id="f_diff" readonly value="0"></div>' +
        '<div class="field"><label class="lbl" for="f_reason">สาเหตุ</label>' +
          '<select class="sel" id="f_reason">' +
            '<option>ผลต่างจากการตรวจนับประจำงวด</option>' +
            '<option>สินค้าชำรุด / เสื่อมสภาพ</option>' +
            '<option>สินค้าสูญหาย</option>' +
            '<option>บันทึกรับ-จ่ายผิดพลาด</option>' +
            '<option>อื่น ๆ</option>' +
          '</select></div>' +
        '<div class="field span2" style="display:flex;align-items:flex-end">' +
          '<button class="btn btn-o" id="btnAdd" style="width:100%">เพิ่มลงรายการ</button></div>' +
      '</div>') +

    '<div style="height:16px"></div>' +

    card("รายการปรับปรุง",
      '<button class="btn btn-p" id="btnSave" disabled>บันทึกเอกสาร</button>' +
      '<button class="btn btn-g" id="btnClear">ล้างรายการ</button>', '<div id="cartBox"></div>') +

    '<div style="height:16px"></div>' +

    card("รายงานการปรับปรุงล่าสุด",
      '<button class="btn btn-o btn-sm" id="btnRep">พิมพ์รายงาน</button>' +
      '<button class="btn btn-g btn-sm" id="btnSheet">พิมพ์ใบตรวจนับ</button>',
      adjustTable());

  const refresh = () => {
    const b = stockOf($("#f_prod").value, $("#f_wh").value);
    $("#f_book").value = num(b, 0);
    const c = parseFloat($("#f_count").value);
    $("#f_diff").value = isNaN(c) ? "0" : num(c - b, 0);
    $("#f_diff").style.color = isNaN(c) || c === b ? "" : (c > b ? "var(--ok)" : "var(--err)");
  };
  $("#f_prod").onchange = refresh;
  $("#f_wh").onchange = refresh;
  $("#f_count").oninput = refresh;
  $("#f_date").onchange = () => { $("#f_doc").value = nextDocNo("ADJUST", $("#f_date").value); };
  refresh();
  drawAdjCart();

  $("#btnAdd").onclick = () => {
    const pid = $("#f_prod").value, wh = $("#f_wh").value;
    const counted = parseFloat($("#f_count").value);
    if (isNaN(counted) || counted < 0) return toast("กรุณาระบุยอดนับได้จริง", "err");
    const book = stockOf(pid, wh);
    const diff = counted - book;
    if (diff === 0) return toast("ยอดตรงกับบัญชี ไม่ต้องปรับปรุง", "warn");
    if (cart.some(c => c.productId === pid && c.whId === wh))
      return toast("มีรายการสินค้านี้ในเอกสารแล้ว", "warn");
    cart.push({ productId: pid, whId: wh, whTo: "", book: book, counted: counted, qty: diff,
                note: $("#f_reason").value });
    $("#f_count").value = "";
    drawAdjCart(); refresh();
    toast("เพิ่มรายการปรับปรุง " + prodName(pid));
  };
  $("#btnClear").onclick = () => { cart = []; drawAdjCart(); };

  $("#btnSave").onclick = () => {
    if (!cart.length) return;
    const date = $("#f_date").value || todayISO();
    const doc = nextDocNo("ADJUST", date);
    const ts = new Date(date + "T09:00:00").getTime();
    cart.forEach(c => DB.txns.push({
      id: uid(), type: "ADJUST", docNo: doc, date: date, productId: c.productId,
      qty: c.qty, whId: c.whId, whTo: "", note: c.note, ref: "นับได้ " + c.counted + " / บัญชี " + c.book,
      user: "admin", ts: ts
    }));
    commitDocNo("ADJUST", date);
    DB.txns.sort((a, b) => a.ts - b.ts);
    save();
    toast("บันทึกเอกสารปรับปรุง " + doc + " เรียบร้อย");
    cart = [];
    viewAdjust();
  };

  $("#btnRep").onclick = () => printTxnReport("ADJUST");
  $("#btnSheet").onclick = () => printCountSheet($("#f_wh").value);
}

function nextProdCode() {
  let n = 1;
  DB.products.forEach(p => {
    const mm = /^P(\d+)$/.exec(p.code);
    if (mm) n = Math.max(n, parseInt(mm[1], 10) + 1);
  });
  return "P" + String(n).padStart(3, "0");
}

/** ย่อรูปด้วย canvas ก่อนเก็บลง localStorage */
function resizeImage(file, cb) {
  if (!/^image\//.test(file.type)) return toast("กรุณาเลือกไฟล์รูปภาพ", "err");
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const MAX = 480;
      let w = im.width, h = im.height;
      if (w > h && w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      else if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      const cx = cv.getContext("2d");
      cx.fillStyle = "#fff"; cx.fillRect(0, 0, w, h);
      cx.drawImage(im, 0, 0, w, h);
      cb(cv.toDataURL("image/jpeg", 0.82));
    };
    im.onerror = () => toast("ไม่สามารถอ่านไฟล์รูปภาพได้", "err");
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/** การเคลื่อนไหวของรายการหนึ่งเมื่อมองจากคลังที่เลือก (ไม่ระบุคลัง = มองรวมทุกคลัง) */
function movement(t, wid) {
  if (t.type === "RECEIVE") return (!wid || t.whId === wid) ? t.qty : 0;
  if (t.type === "ISSUE")   return (!wid || t.whId === wid) ? -t.qty : 0;
  if (t.type === "ADJUST")  return (!wid || t.whId === wid) ? t.qty : 0;
  if (t.type === "TRANSFER") {
    if (!wid) return 0;                       // โอนภายในองค์กร ยอดรวมไม่เปลี่ยน
    if (t.whId === wid) return -t.qty;
    if (t.whTo === wid) return t.qty;
  }
  return 0;
}

/* ============================================================ VIEW: กราฟสรุป */
let gMonths = 12, gProd = "", gWh = "";

function viewGraphs() {
  const now = new Date();
  const months = [];
  for (let i = gMonths - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({
      key: d.toISOString().slice(0, 7),
      label: d.toLocaleDateString("th-TH", { month: "short" }) +
             (gMonths > 6 ? " " + String((d.getFullYear() + 543) % 100) : "")
    });
  }
  const match = t => (!gProd || t.productId === gProd) && (!gWh || t.whId === gWh || t.whTo === gWh);

  const inD = [], outD = [], balD = [];
  let running = 0;
  DB.txns.forEach(t => {
    if (!match(t)) return;
    if (t.date.slice(0, 7) < months[0].key) running += movement(t, gWh);
  });
  months.forEach(mo => {
    let i = 0, o = 0, net = 0;
    DB.txns.forEach(t => {
      if (!match(t) || t.date.slice(0, 7) !== mo.key) return;
      const mv = movement(t, gWh);
      if (mv > 0) i += mv; else if (mv < 0) o += -mv;
      net += mv;
    });
    running += net;
    inD.push(i); outD.push(o); balD.push(running);
  });

  const m = stockMap();
  const byCat = {};
  DB.products.forEach(p => {
    const q = gWh ? stockOf(p.id, gWh, m) : stockTotal(p.id, m);
    byCat[p.cat] = (byCat[p.cat] || 0) + q;
  });
  const catItems = Object.keys(byCat).map(k => ({ label: k, value: byCat[k], color: "#0F8A4D" }))
    .sort((a, b) => b.value - a.value);
  const topProd = DB.products.map(p => ({
    label: p.name, value: gWh ? stockOf(p.id, gWh, m) : stockTotal(p.id, m), color: "#00693C"
  })).sort((a, b) => b.value - a.value).slice(0, 10);

  $("#content").innerHTML =
    card("ตัวกรองกราฟ", "",
      '<div class="row" style="align-items:flex-end">' +
        '<div style="min-width:160px"><label class="lbl" for="g_m">ช่วงเวลา</label>' +
          '<select class="sel" id="g_m">' +
          [6, 12, 18, 24].map(n => '<option value="' + n + '"' + (n === gMonths ? " selected" : "") + '>' +
            n + ' เดือนล่าสุด</option>').join("") + '</select></div>' +
        '<div style="min-width:220px"><label class="lbl" for="g_p">สินค้า</label>' +
          '<select class="sel" id="g_p"><option value="">ทุกรายการ</option>' + prodOptions(gProd) + '</select></div>' +
        '<div style="min-width:210px"><label class="lbl" for="g_w">คลังสินค้า</label>' +
          '<select class="sel" id="g_w"><option value="">ทุกคลัง</option>' + whOptions(gWh) + '</select></div>' +
      '</div>') +

    '<div style="height:16px"></div>' +

    card("ปริมาณคงเหลือ (แนวโน้มขึ้น-ลง)", '<span class="bdg bdg-gray">ยอดสะสมปลายเดือน</span>',
      '<div class="chart">' + chartLine(balD, months.map(x => x.label), { color: "#00693C", height: 260 }) + '</div>') +

    '<div style="height:16px"></div>' +

    card("ปริมาณรับเข้า เทียบกับ จ่ายออก", "",
      '<div class="chart">' + chartBars(
        [ { name:"รับเข้า", color:"#0F8A4D", data:inD }, { name:"จ่ายออก", color:"#B3261E", data:outD } ],
        months.map(x => x.label), { height: 270 }) + '</div>' +
      '<div class="legend"><span><i style="background:#0F8A4D"></i>รับเข้า</span>' +
      '<span><i style="background:#B3261E"></i>จ่ายออก</span></div>' +
      '<div class="row" style="margin-top:12px">' +
        '<span class="bdg bdg-ok">รับเข้ารวม ' + num(inD.reduce((a, b) => a + b, 0), 0) + '</span>' +
        '<span class="bdg bdg-err">จ่ายออกรวม ' + num(outD.reduce((a, b) => a + b, 0), 0) + '</span>' +
        '<span class="bdg bdg-info">คงเหลือปัจจุบัน ' + num(balD[balD.length - 1] || 0, 0) + '</span>' +
      '</div>') +

    '<div style="height:16px"></div>' +

    '<div class="grid g2">' +
      card("ยอดคงเหลือแยกตามหมวดหมู่", "", '<div class="chart">' + chartHBar(catItems) + '</div>') +
      card("10 อันดับสินค้าคงเหลือสูงสุด", "", '<div class="chart">' + chartHBar(topProd) + '</div>') +
    '</div>';

  $("#g_m").onchange = e => { gMonths = +e.target.value; viewGraphs(); };
  $("#g_p").onchange = e => { gProd = e.target.value; viewGraphs(); };
  $("#g_w").onchange = e => { gWh = e.target.value; viewGraphs(); };
}

      '<button class="btn btn-d" id="b_reset">ล้างข้อมูลและสร้างข้อมูลตัวอย่างใหม่</button>' +
    '</div>' +
    '<div style="margin-top:16px;padding:12px;background:var(--brand-50);border-radius:9px;font-size:13px;color:var(--brand-d)">' +
    'ข้อมูลปัจจุบัน: สินค้า <b>' + DB.products.length + '</b> รายการ · คลัง <b>' + DB.warehouses.length +
    '</b> แห่ง · รายการเคลื่อนไหว <b>' + num(DB.txns.length, 0) + '</b> รายการ</div>',
    "", close => {
      $("#b_exp").onclick = () => {
        const url = URL.createObjectURL(new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" }));
        const a = document.createElement("a");
        a.href = url; a.download = "raot-inventory-backup-" + todayISO() + ".json"; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        toast("ส่งออกไฟล์สำรองแล้ว");
      };
      $("#b_imp").onclick = () => $("#b_file").click();
      $("#b_file").onchange = e => {
        const f = e.target.files[0]; if (!f) return;
        const fr = new FileReader();
        fr.onload = () => {
          try {
            const d = JSON.parse(fr.result);
            if (!d.products || !d.warehouses || !d.txns) throw new Error("รูปแบบไฟล์ไม่ถูกต้อง");
            if (!confirm("การนำเข้าจะแทนที่ข้อมูลปัจจุบันทั้งหมด ยืนยันหรือไม่?")) return;
            DB = d; DB.counters = DB.counters || {}; save(); close(); go(VIEW);
            toast("นำเข้าข้อมูลเรียบร้อย");
          } catch (err) { toast("ไฟล์ไม่ถูกต้อง: " + err.message, "err"); }
        };
        fr.readAsText(f);
      };
      $("#b_reset").onclick = () => {
        if (!confirm("ข้อมูลทั้งหมดจะถูกลบและสร้างข้อมูลตัวอย่างใหม่ ยืนยันหรือไม่?")) return;
        DB = seed(); save(); close(); go("dash");
        toast("สร้างข้อมูลตัวอย่างใหม่เรียบร้อย");
      };
    });
}

/* ============================================================ Auth + boot */
function showApp() {
  $("#login").hidden = true;
  $("#app").hidden = false;
  $("#footWh").textContent = DB.warehouses.length + " คลังทั่วประเทศ";
  go("dash");
}

$("#loginForm").addEventListener("submit", e => {
  e.preventDefault();
  const u = $("#u").value.trim(), p = $("#p").value;
  const err = $("#loginErr");
  if (u === AUTH.username && p === AUTH.password) {
    try { sessionStorage.setItem(SESS, "1"); } catch (x) {}
    err.style.display = "none";
    load();
    showApp();
    toast("ยินดีต้อนรับเข้าสู่ระบบ");
  } else {
    err.textContent = "ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง";
    err.style.display = "inline-flex";
    $("#p").value = "";
    $("#p").focus();
  }
});

$("#btnLogout").addEventListener("click", () => {
  try { sessionStorage.removeItem(SESS); } catch (x) {}
  $("#app").hidden = true;
  $("#login").hidden = false;
  $("#u").value = ""; $("#p").value = "";
  $("#loginErr").style.display = "none";
});

$("#btnBackup").addEventListener("click", backupModal);

$("#burger").addEventListener("click", () => {
  const sb = $("#sidebar");
  sb.classList.add("open");
  const sc = document.createElement("div");
  sc.id = "scrim";
  sc.onclick = () => { sb.classList.remove("open"); sc.remove(); };
  document.body.appendChild(sc);
});

/* delegate: ปุ่มที่มี data-nav ทุกจุดในหน้า */
document.addEventListener("click", e => {
  const b = e.target.closest ? e.target.closest("[data-nav]") : null;
  if (b) go(b.dataset.nav);
});

/* คงสถานะล็อกอินไว้ระหว่างรีเฟรชหน้า (ภายในแท็บเดียวกัน) */
(function boot() {
  let logged = false;
  try { logged = sessionStorage.getItem(SESS) === "1"; } catch (x) {}
  if (logged) { load(); showApp(); }
  else { $("#u").focus(); }
})();
</script>
</body>
</html>
